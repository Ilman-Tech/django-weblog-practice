{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'account/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'account/css/email.css' %}">
</head>
<body>

<section>
    <form action="" class="box" method="post">
        <h1>Register</h1>
        <input type="text" placeholder="Username..." name="username"><br>
        <input type="email" placeholder="email..." name="email" class="email"><br>
        <input type="password" placeholder="password" name="password"><br>
        <input type="password" placeholder="Confrin password" name="password2"><br>
        <input type="submit" value="register">
        {% csrf_token %}
    </form>
    <div class="layout1"></div>
    <div class="layout2"></div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
    const passwordField = document.querySelector('input[name="password"]');
    const confirmPasswordField = document.querySelector('input[name="password2"]');

    // Function to prevent pasting
    const preventPaste = (e) => {
        e.preventDefault();
        alert('کپی کردن در این فیلد مجاز نیست. لطفاً رمز عبور را دستی وارد کنید.');
    };

    // Add event listener for paste event
    if (passwordField) {
        passwordField.addEventListener('paste', preventPaste);
    }
    if (confirmPasswordField) {
        confirmPasswordField.addEventListener('paste', preventPaste);
    }
});

</script>

</body>
</html>
